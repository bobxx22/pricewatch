# Development stack: PostgreSQL, Redis, Django, a Celery worker, Celery beat and the bot.
#   docker compose up --build
#   docker compose exec web python manage.py createsuperuser
#   docker compose exec web python manage.py seed_demo     (optional demo data)
# then open http://localhost:8000/
# The bot starts only with TELEGRAM_BOT_TOKEN in .env. For production add the override:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# The database password below is a local development placeholder, not a secret.

x-app: &app
  build: .
  env_file:
    - path: .env
      required: false
  environment:
    DJANGO_DEBUG: "true"
    DATABASE_URL: postgres://pricewatch:pricewatch@db:5432/pricewatch
    REDIS_URL: redis://redis:6379/0
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: pricewatch
      POSTGRES_USER: pricewatch
      POSTGRES_PASSWORD: pricewatch
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pricewatch -d pricewatch"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    <<: *app
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"

  worker:
    <<: *app
    command: celery -A config worker --loglevel=info

  beat:
    <<: *app
    command: celery -A config beat --loglevel=info --schedule /tmp/celerybeat-schedule

  bot:
    <<: *app
    command: python manage.py runbot
    restart: on-failure

volumes:
  pgdata:
