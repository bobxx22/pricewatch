{% load static %}<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{% block title %}PriceWatch{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@600;700&display=swap">
  <link rel="stylesheet" href="{% static 'dashboard/app.css' %}">
</head>
<body>
  <a class="skip-link" href="#main">Перейти до змісту</a>
  <header class="site-header">
    <a class="wordmark" href="{% url 'dashboard:index' %}">PriceWatch</a>
    <nav class="site-nav" aria-label="Розділи">
      <a href="{% url 'dashboard:index' %}"{% if request.resolver_match.app_name == 'dashboard' %} aria-current="page"{% endif %}>Товари</a>
      <a href="{% url 'api:docs' %}">API</a>
      <a href="{% url 'admin:index' %}">Адмінка</a>
    </nav>
  </header>
  <main id="main" class="page">
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <p>Ціни беруться з публічних сторінок магазинів з урахуванням robots.txt. <a href="https://github.com/bobxx22/pricewatch">Код проєкту на GitHub</a></p>
  </footer>
  {% block scripts %}{% endblock %}
</body>
</html>
