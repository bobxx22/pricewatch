# Production overrides for a single server:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Put a TLS-terminating proxy (Caddy, nginx) in front of port 8000 and set in .env:
#   DJANGO_SECRET_KEY, DJANGO_ALLOWED_HOSTS, DJANGO_CSRF_TRUSTED_ORIGINS, DJANGO_HTTPS=true,
#   TELEGRAM_BOT_TOKEN, and a real POSTGRES password (here and in DATABASE_URL).

x-production: &production
  restart: unless-stopped
  environment:
    DJANGO_DEBUG: "false"
    DATABASE_URL: postgres://pricewatch:pricewatch@db:5432/pricewatch
    REDIS_URL: redis://redis:6379/0

services:
  db:
    restart: unless-stopped

  redis:
    restart: unless-stopped

  web:
    <<: *production
    command: >-
      sh -c "python manage.py migrate --noinput &&
      gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --access-logfile -"
    ports:
      - "127.0.0.1:8000:8000"

  worker:
    <<: *production

  beat:
    <<: *production

  bot:
    <<: *production
