<!DOCTYPE html>
<!-- Trimmed copy of a webscraper.io test-shop product page (November 2026): schema.org
     microdata only. A nested Brand item, added here, checks that its name is not taken
     for the product's name. -->
<html lang="en">
<body>
<div class="card thumbnail" itemscope itemtype="https://schema.org/Product">
  <div class="product-wrapper card-body">
    <div itemprop="brand" itemscope itemtype="https://schema.org/Brand"><span itemprop="name">Asus</span></div>
    <img alt="item" class="image img-fluid" itemprop="image" src="/images/test-sites/e-commerce/items/cart2.png">
    <div class="caption">
      <h4 class="price float-end" itemprop="offers" itemscope itemtype="https://schema.org/Offer">
        <span itemprop="price">$295.99</span>
        <meta content="USD" itemprop="priceCurrency">
      </h4>
      <h4 class="title card-title" itemprop="name">Asus VivoBook X441NA-GA190</h4>
      <p class="description card-text" itemprop="description">Asus VivoBook X441NA-GA190 Chocolate Black, 14", Celeron N3450, 4GB, 128GB SSD</p>
    </div>
    <div class="ratings" itemprop="aggregateRating" itemscope itemtype="https://schema.org/AggregateRating">
      <p class="review-count"><span itemprop="reviewCount">1</span> reviews</p>
    </div>
  </div>
</div>
</body>
</html>
